name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          ./tool/package_windows_release.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Generate release notes for this version
        shell: pwsh
        run: |
          ./tool/generate_release_notes.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Create GitHub Release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/Git_Gui_Expand-$env:GITHUB_REF_NAME-windows-x64.zip" `
            --title "Git GUI Expand $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag

      - name: Upload package to Gitee Release
        if: ${{ env.GITEE_TOKEN != '' }}
        shell: pwsh
        run: |
          ./tool/upload_gitee_release.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -AssetPath "dist/Git_Gui_Expand-$env:GITHUB_REF_NAME-windows-x64.zip" `
            -NotesPath RELEASE_NOTES.md
