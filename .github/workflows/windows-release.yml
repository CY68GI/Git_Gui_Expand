name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $stage = "dist/package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem "build/windows/x64/runner/Release" -Force |
            Where-Object { $_.Name -ne "userdata" } |
            Copy-Item -Destination $stage -Recurse
          Copy-Item README.md, CHANGELOG.md -Destination $stage
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          @{
            version = $version
            tag = $env:GITHUB_REF_NAME
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json |
            Set-Content -LiteralPath "$stage/version.json" -Encoding utf8
          Compress-Archive `
            -Path "$stage/*" `
            -DestinationPath "dist/Git_Gui_Expand-${{ github.ref_name }}-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Create GitHub Release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/Git_Gui_Expand-$env:GITHUB_REF_NAME-windows-x64.zip" `
            --title "Git GUI Expand $env:GITHUB_REF_NAME" `
            --notes-file CHANGELOG.md `
            --verify-tag
