name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $stage = "dist/package"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $versionStage = Join-Path $stage "versions/$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path $versionStage | Out-Null
          Get-ChildItem "build/windows/x64/runner/Release" -Force |
            Where-Object {
              $_.Name -notin @("userdata", "GitGuiExpandLauncher.exe")
            } |
            Copy-Item -Destination $versionStage -Recurse
          Copy-Item "build/windows/x64/runner/Release/GitGuiExpandLauncher.exe" `
            -Destination $stage
          Copy-Item README.md, CHANGELOG.md -Destination $stage
          @{
            version = $version
            tag = $env:GITHUB_REF_NAME
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json |
            Set-Content -LiteralPath "$versionStage/version.json" -Encoding utf8
          Set-Content -LiteralPath "$stage/current-version.txt" `
            -Value $version -Encoding utf8
          Compress-Archive `
            -Path "$stage/*" `
            -DestinationPath "dist/Git_Gui_Expand-${{ github.ref_name }}-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Generate release notes for this version
        shell: pwsh
        run: |
          ./tool/generate_release_notes.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Create GitHub Release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/Git_Gui_Expand-$env:GITHUB_REF_NAME-windows-x64.zip" `
            --title "Git GUI Expand $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag

      - name: Upload package to Gitee Release
        if: ${{ env.GITEE_TOKEN != '' }}
        shell: pwsh
        run: |
          ./tool/upload_gitee_release.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -AssetPath "dist/Git_Gui_Expand-$env:GITHUB_REF_NAME-windows-x64.zip" `
            -NotesPath RELEASE_NOTES.md
